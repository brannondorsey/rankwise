name: Wheels

# Builds abi3 wheels for every v0.1 target plus the sdist. Called by release.yml on tags;
# run it by hand to check the build without publishing.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -m rankwise-py/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m rankwise-py/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
