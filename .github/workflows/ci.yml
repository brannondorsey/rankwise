name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Which ISAs this runner has
        run: cargo run --release -q -p rankwise --example describe
      - name: Tests (0-1 principle networks, oracle on every available ISA)
        run: cargo test --release -p rankwise --features ndarray
      - name: C ABI tests
        run: cargo test --release -p rankwise-capi
      - name: Forced scalar fallback
        run: cargo test --release -p rankwise --test oracle
        env:
          RANKWISE_ISA: scalar

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check -p rankwise -p rankwise-capi --features rankwise/ndarray

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features rankwise/ndarray -- -D warnings

  header:
    name: C header is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --version 0.29.4 --locked
      - run: cd rankwise-capi && cbindgen --config cbindgen.toml --crate rankwise-capi --output /tmp/rankwise.h && diff -u include/rankwise.h /tmp/rankwise.h

  python:
    name: Conformance · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned references
        run: pip install -r conformance/requirements.txt
      - name: Build and install the wheel
        shell: bash
        run: |
          pip install "maturin>=1.5,<2"
          maturin build --release -m rankwise-py/Cargo.toml -o dist
          pip install --no-index --find-links dist rankwise
      - name: Conformance suite (every ISA the runner supports)
        run: python -m pytest conformance -q
