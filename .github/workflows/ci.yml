name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Which ISAs this runner has
        run: cargo run --release -q -p rankwise --example describe
      - name: Tests (0-1 principle networks, oracle on every available ISA)
        run: cargo test --release -p rankwise --features ndarray
      - name: C ABI tests
        run: cargo test --release -p rankwise-capi
      - name: Forced scalar fallback
        run: cargo test --release -p rankwise --test oracle
        env:
          RANKWISE_ISA: scalar

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check -p rankwise -p rankwise-capi --features rankwise/ndarray

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features rankwise/ndarray -- -D warnings

  js:
    name: JavaScript · native + WebAssembly · Node, Bun, Deno, Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Clippy (wasm32 portable and simd128, Node-API addon)
        run: |
          cargo clippy -p rankwise -p rankwise-js --target wasm32-unknown-unknown -- -D warnings
          RUSTFLAGS="-C target-feature=+simd128" cargo clippy -p rankwise -p rankwise-js --target wasm32-unknown-unknown --target-dir target/simd -- -D warnings
          cargo clippy -p rankwise-js --features node -- -D warnings
      - name: Oracle tests on wasm32 + simd128 (simd128 against the portable kernels, under Node's WASI)
        run: cargo test --release -p rankwise --target wasm32-wasip1
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/rankwise-js/scripts/wasi-run.mjs
      - name: Build both WebAssembly modules and the addon
        run: node rankwise-js/scripts/build.mjs --all
      - name: NumPy / SciPy / astropy references
        run: |
          pip install -r conformance/requirements.txt
          python rankwise-js/test/make_fixtures.py
      - name: Node (backend selection, native and WebAssembly conformance)
        run: node rankwise-js/test/api.test.mjs && node rankwise-js/test/conformance.test.mjs
      - name: Bun
        run: bun rankwise-js/test/api.test.mjs && bun rankwise-js/test/conformance.test.mjs
      - name: Deno
        run: deno run -A rankwise-js/test/api.test.mjs && deno run -A rankwise-js/test/conformance.test.mjs
      - name: Install from a local registry (npm and bun pick one addon; fallback; browser bundle)
        run: node rankwise-js/test/package.test.mjs
      - name: Chromium
        working-directory: rankwise-js
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node test/browser.mjs
      - name: Examples
        run: |
          node examples/js/node-stack.mjs /tmp/stack
          bun examples/js/bun-server.ts --selftest
      - name: Benchmark smoke run
        working-directory: rankwise-js
        run: npm ci && node bench/bench.mjs --quick

  addon:
    name: Node-API addon · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build the addon and the WebAssembly modules
        run: node rankwise-js/scripts/build.mjs --all --dev
      - name: Backend selection and both backends (API tests)
        run: node rankwise-js/test/api.test.mjs

  header:
    name: C header is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --version 0.29.4 --locked
      - run: cd rankwise-capi && cbindgen --config cbindgen.toml --crate rankwise-capi --output /tmp/rankwise.h && diff -u include/rankwise.h /tmp/rankwise.h

  python:
    name: Conformance · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pinned references
        run: pip install -r conformance/requirements.txt
      - name: Build and install the wheel
        shell: bash
        run: |
          pip install "maturin>=1.5,<2"
          maturin build --release -m rankwise-py/Cargo.toml -o dist
          pip install --no-index --find-links dist rankwise
      - name: Conformance suite (every ISA the runner supports)
        run: python -m pytest conformance -q
