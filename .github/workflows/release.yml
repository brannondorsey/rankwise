name: Release

# Publishes a v* tag to PyPI, crates.io and npm with trusted publishing (OIDC): no stored tokens.
# Each registry must list this repo, this workflow file (release.yml) and the environment
# named below as a trusted publisher. See HANDOFF.md, "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare tag with workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rankwise"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match rankwise $version"
            exit 1
          fi
          npm_version=$(node -p 'require("./rankwise-js/package.json").version')
          if [ "v$npm_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match rankwise-js/package.json $npm_version"
            exit 1
          fi

  wheels:
    needs: check
    uses: ./.github/workflows/wheels.yml

  npm-packages:
    needs: check
    uses: ./.github/workflows/npm.yml

  pypi:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rankwise/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # only the Python artifacts: this run also holds the npm packages
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: Publish to crates.io
    # After the wheels build, so a release that cannot ship to PyPI does not ship here either.
    needs: wheels
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/rankwise
    permissions:
      id-token: write
    steps:
      - name: Skip if this version is already on crates.io
        id: exists
        # The first release is published by hand (trusted publishing needs the crate to exist).
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'rankwise-release (github.com/brannondorsey/rankwise)' \
            "https://crates.io/api/v1/crates/rankwise/${GITHUB_REF_NAME#v}")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.exists.outputs.published == 'false'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.exists.outputs.published == 'false'
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published == 'false'
        id: auth
      - run: cargo publish -p rankwise
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: Publish to npm
    # After the wheels build too, so a release ships to every registry or none.
    needs: [wheels, npm-packages]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/rankwise
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "24" # npm 11.5.1+ for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          name: npm-packages
          path: release
      - name: Publish the platform packages, then rankwise
        # rankwise last, so its optional dependencies exist when it appears. A version already
        # on npm is skipped, so a failed run can be re-run, and the first release (published
        # by hand: trusted publishing needs the packages to exist) is not published twice.
        run: |
          for f in release/rankwise-js-*.tgz release/rankwise-[0-9]*.tgz; do
            id=$(tar -xzOf "$f" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            if npm view "$id" version >/dev/null 2>&1; then echo "$id is already published"; continue; fi
            npm publish "$f" --access public
          done
