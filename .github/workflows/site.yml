# Builds site/ and deploys it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "site-v2/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site-v2/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # v2 preview, served at /v2/
      - run: npm ci && npx vite build --outDir ../site/dist/v2 --emptyOutDir
        working-directory: site-v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
