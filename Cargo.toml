[workspace]
resolver = "2"
members = ["rankwise", "rankwise-capi", "rankwise-py", "rankwise-wasm"]
default-members = ["rankwise", "rankwise-capi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Brannon Dorsey <brannon@brannondorsey.com>"]
repository = "https://github.com/brannondorsey/rankwise"
homepage = "https://github.com/brannondorsey/rankwise"
keywords = ["simd", "median", "quantile", "statistics", "astronomy"]
categories = ["science", "mathematics", "algorithms"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
